<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forever AH Crafting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23c98d12'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%23241800'%3E%E2%9A%92%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0b0c10; --panel: #17181e; --panel-top: #1e1f27; --panel2: #1f2028; --sunken: #0e0f13;
    --line: #2b2b31; --line2: #3b3a40; --gold-line: #5c4720;
    --text: #efe9da; --muted: #a39d8e; --dim: #736e63;
    --accent: #f2c14e; --accent2: #c9921d; --good: #62d07c; --bad: #ee6c62; --warn: #eeb650; --link: #84bcff;
    --q0: #9d9d9d; --q1: #f4f4f4; --q2: #1eff00; --q3: #3d9cff; --q4: #bd75ff; --q5: #ff8000;
    --cg: #ffd24a; --cs: #cfd0da; --cc: #e8a35e;
    --radius: 12px; --display: Cinzel, Georgia, "Palatino Linotype", serif;
    --shadow: 0 10px 28px rgba(0,0,0,.34);
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; color: var(--text); min-height: 100vh;
    font: 14px/1.5 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-feature-settings: "tnum";
    background:
      radial-gradient(1100px 420px at 50% -120px, rgba(214,155,40,.17), transparent 70%),
      radial-gradient(800px 600px at 100% 0, rgba(70,90,160,.08), transparent 70%),
      var(--bg);
    background-attachment: fixed; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button, input, select, textarea { font: inherit; color: inherit; }
  h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: .4px; }
  h2 { font-size: 18px; margin: 0 0 12px; color: var(--accent); }
  h3 { font-size: 14px; margin: 20px 0 9px; color: var(--text); }
  p { line-height: 1.55; }
  .muted { color: var(--muted); } .dim { color: var(--dim); }
  .good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); }
  .small { font-size: 12px; }
  .nowrap { white-space: nowrap; }
  .hidden { display: none !important; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* header */
  header.top { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding: 13px 28px;
    background: rgba(16,17,22,.88); backdrop-filter: blur(10px); border-bottom: 1px solid var(--gold-line);
    box-shadow: 0 1px 0 rgba(242,193,78,.08), 0 8px 26px rgba(0,0,0,.4); position: sticky; top: 0; z-index: 20; }
  .brand { display: flex; align-items: center; gap: 13px; margin-right: auto; }
  .logo { width: 44px; height: 44px; border-radius: 11px; display: grid; place-items: center; font-size: 23px; color: #2a1b00;
    background: linear-gradient(145deg, #ffe08a, #d29a22 55%, #91640d);
    box-shadow: 0 0 0 1px #7a560f, 0 0 0 3px rgba(242,193,78,.14), 0 5px 15px rgba(214,155,40,.3); }
  .brand h1 { margin: 0; font-size: 22px; line-height: 1.15; letter-spacing: .6px;
    background: linear-gradient(180deg, #ffe7a6, #e0a735); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .brand .sub { font-size: 12px; color: var(--muted); }
  #ahStatus { font-size: 12px; color: var(--muted); max-width: 470px; padding: 6px 12px; border: 1px solid var(--line);
    border-radius: 999px; background: rgba(0,0,0,.25); }
  #ahStatus b { color: var(--text); font-weight: 600; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--dim); margin-right: 7px; }
  .dot.ok { background: var(--good); box-shadow: 0 0 8px rgba(98,208,124,.75); }
  .dot.old { background: var(--warn); }
  .budget { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .7px; }
  .budget input { width: 125px; font-size: 14px; color: var(--cg); font-weight: 600; text-align: right; text-transform: none; letter-spacing: 0; }

  nav.tabs { display: flex; justify-content: center; gap: 4px; padding: 0 20px; background: rgba(12,13,17,.75);
    border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
  nav.tabs button { background: none; border: 0; padding: 14px 18px 13px; color: var(--muted); cursor: pointer; white-space: nowrap;
    font-family: var(--display); font-weight: 600; font-size: 13.5px; letter-spacing: .5px; position: relative; transition: color .15s; }
  nav.tabs button:hover { color: var(--text); }
  nav.tabs button.active { color: var(--accent); text-shadow: 0 0 16px rgba(242,193,78,.42); }
  nav.tabs button.active::after { content: ""; position: absolute; left: 12%; right: 12%; bottom: 0; height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent); }
  main { padding: 24px 28px 70px; max-width: 1560px; margin: 0 auto; }

  /* controls */
  input[type=text], input[type=number], input[type=password], input:not([type]), select, textarea {
    background: var(--sunken); border: 1px solid var(--line2); border-radius: 8px; padding: 7px 10px; outline: none;
    transition: border-color .15s, box-shadow .15s; }
  input::placeholder, textarea::placeholder { color: var(--dim); }
  input:hover, select:hover, textarea:hover { border-color: #55525a; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent2); box-shadow: 0 0 0 3px rgba(242,193,78,.14); }
  select option, select optgroup { background: #17181e; }
  input[type=checkbox] { accent-color: var(--accent2); width: 15px; height: 15px; }
  textarea { width: 100%; min-height: 120px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .btn { background: linear-gradient(180deg, #2a2b34, #202129); border: 1px solid var(--line2); border-radius: 8px; padding: 7px 13px; cursor: pointer;
    white-space: nowrap; font-weight: 500; transition: border-color .15s, filter .15s, transform .05s; }
  .btn:hover { border-color: var(--accent2); filter: brightness(1.12); }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: linear-gradient(180deg, #ffd573, #d79c1e); color: #2a1b00; border-color: #a97a10; font-weight: 600;
    box-shadow: 0 3px 12px rgba(214,155,40,.26), inset 0 1px 0 rgba(255,255,255,.35); }
  .btn.danger { color: var(--bad); }
  .btn.sm { padding: 4px 10px; font-size: 12px; border-radius: 7px; }
  .btn:disabled { opacity: .5; cursor: default; }
  label.chk { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; user-select: none; font-size: 13px; color: #d8d2c3; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .row + .row { margin-top: 12px; }
  .field { display: flex; flex-direction: column; gap: 5px; font-size: 11.5px; color: var(--muted); }
  .field > input, .field > select { color: var(--text); font-size: 14px; }
  .spacer { flex: 1; }
  details summary { cursor: pointer; }

  .card { background: linear-gradient(180deg, var(--panel-top), var(--panel)); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px 20px; margin-bottom: 18px; box-shadow: var(--shadow), inset 0 1px 0 rgba(255,225,160,.05); }
  .card.tight { padding: 12px 16px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 18px; }
  .banner { border: 1px solid #6a5423; background: linear-gradient(180deg, #2a2213, #211b10); color: #f6e3b0; border-radius: 10px; padding: 11px 15px; margin-bottom: 16px; }
  .banner.info { border-color: #2c4b70; background: linear-gradient(180deg, #14202f, #101a26); color: #cfe2f8; }

  /* professions */
  .profs { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .prof { display: flex; align-items: center; gap: 10px; background: var(--sunken); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px;
    cursor: text; transition: border-color .15s, background .15s; }
  .prof:hover { border-color: var(--line2); }
  .prof .ico { width: 34px; height: 34px; margin: 0; filter: grayscale(.85) brightness(.72); transition: filter .15s; }
  .profname { flex: 1; min-width: 0; font-size: 13px; font-weight: 500; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .skillbar { display: block; height: 4px; border-radius: 3px; margin-top: 6px; background: #292a31; overflow: hidden; }
  .skillbar b { display: block; height: 100%; width: var(--skill, 0%); border-radius: 3px; background: linear-gradient(90deg, #a87412, var(--accent)); transition: width .25s; }
  .prof input { flex: 0 0 62px; width: 62px; text-align: right; font-weight: 600; padding: 6px 8px; }
  .prof.on { border-color: var(--gold-line); background: linear-gradient(180deg, #221d13, #17140e); }
  .prof.on .ico { filter: none; }
  .prof.on .profname { color: var(--accent); }

  /* top picks */
  .heroes { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .hero { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--radius); cursor: pointer; position: relative; overflow: hidden;
    border: 1px solid var(--gold-line); background: linear-gradient(120deg, #2a2213, #191a20 62%); box-shadow: var(--shadow); transition: transform .12s, border-color .12s; }
  .hero:hover { transform: translateY(-2px); border-color: var(--accent2); }
  .hero .rank { font-family: var(--display); font-weight: 700; font-size: 22px; color: var(--accent); opacity: .75; width: 18px; text-align: center; }
  .hero .ico { width: 42px; height: 42px; margin: 0; }
  .heromain { flex: 1; min-width: 0; }
  .heromain b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hero small { display: block; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .heroval { text-align: right; font-size: 16px; font-weight: 600; white-space: nowrap; }

  /* tables */
  .tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: rgba(18,19,24,.75); box-shadow: var(--shadow); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 8px 12px; border-bottom: 1px solid #24252c; text-align: left; vertical-align: middle; }
  tbody tr:last-child > td { border-bottom: 0; }
  th { background: #1b1c23; color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; position: sticky; top: 0; z-index: 1; white-space: nowrap; }
  th.sort { cursor: pointer; }
  th.sort:hover { color: var(--text); }
  th.sorted { color: var(--accent); }
  td.num, th.num { text-align: right; white-space: nowrap; }
  tbody tr { transition: background .1s; }
  tbody tr:hover { background: rgba(242,193,78,.045); }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover { box-shadow: inset 3px 0 0 var(--accent2); }
  tr.locked td { opacity: .48; }
  tr.detail:hover { background: none; }
  tr.detail > td { background: #101116; padding: 16px 18px 18px; box-shadow: inset 0 3px 8px rgba(0,0,0,.35); }
  tr.detail .tablewrap { box-shadow: none; }
  tr.grouphead:hover { background: none; }
  tr.grouphead td { background: linear-gradient(90deg, #272012, #1c1d24 60%); color: var(--accent); font-weight: 700; font-family: var(--display); letter-spacing: .3px; }
  td input { padding: 4px 7px; font-size: 12px; }
  td input.id { width: 76px; } td input.price { width: 92px; }

  .item { font-weight: 500; white-space: nowrap; }
  a.item:hover { text-decoration: none; filter: brightness(1.2); }
  .ico { width: 26px; height: 26px; border-radius: 6px; vertical-align: middle; margin-right: 9px; border: 1px solid #55525a; background: #000; object-fit: cover; box-shadow: 0 1px 4px rgba(0,0,0,.5); }
  .q0 { color: var(--q0); } .q1 { color: var(--q1); } .q2 { color: var(--q2); } .q3 { color: var(--q3); } .q4 { color: var(--q4); } .q5 { color: var(--q5); }
  .q2 .ico { border-color: #2f9c22; } .q3 .ico { border-color: #2d78c8; } .q4 .ico { border-color: #8d52c8; } .q5 .ico { border-color: #c56c0c; }
  .money { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .money i { font-style: normal; font-size: 11px; margin-left: 1px; }
  .money.neg { color: var(--bad); }
  i.cg { color: var(--cg); } i.cs { color: var(--cs); } i.cc { color: var(--cc); }
  .pos .money { color: var(--good); font-weight: 600; }
  .pill { display: inline-block; min-width: 44px; text-align: center; font-size: 11.5px; font-weight: 600; padding: 2px 7px; border-radius: 999px; }
  .pill.up { color: var(--good); background: rgba(98,208,124,.12); }
  .pill.down { color: var(--bad); background: rgba(238,108,98,.12); }

  .badge { display: inline-block; font-size: 10.5px; line-height: 1; padding: 3px 6px; border-radius: 999px; margin-left: 6px; vertical-align: 1px;
    border: 1px solid var(--line2); color: var(--muted); white-space: nowrap; }
  .badge.pat { border-color: #5a4678; color: #d1b5ff; background: rgba(150,110,220,.1); }
  .badge.cd { border-color: #345a7b; color: #98ccff; background: rgba(80,150,220,.1); }
  .badge.u { border-color: #6a5423; color: #efcc73; background: rgba(240,190,70,.09); }
  .badge.custom { border-color: #30633f; color: #84e09a; background: rgba(90,200,120,.09); }
  .badge.de { border-color: #483673; color: #bf95ff; }
  .badge.note { border-color: #3d4250; color: #b9b4a8; cursor: help; }
  .src { font-size: 11px; color: var(--muted); }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat { background: var(--sunken); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .stat .k { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .7px; }
  .stat .v { font-size: 21px; font-weight: 600; margin: 4px 0 2px; }
  .log { font-family: ui-monospace, Consolas, monospace; font-size: 12px; background: var(--sunken); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; max-height: 220px; overflow: auto; white-space: pre-wrap; color: #bdb8ab; min-height: 42px; }
  .steps { margin: 0; padding-left: 20px; color: var(--muted); }
  .steps li { margin: 4px 0; }
  code { background: var(--sunken); border: 1px solid var(--line); padding: 1px 5px; border-radius: 4px; font-size: 12px; }

  /* modal & toast */
  .modal { position: fixed; inset: 0; background: rgba(4,4,7,.72); backdrop-filter: blur(3px); display: grid; place-items: center; z-index: 50; padding: 16px; }
  .modal .box { background: linear-gradient(180deg, var(--panel-top), var(--panel)); border: 1px solid var(--gold-line); border-radius: 14px; width: min(720px, 100%); max-height: 90vh; overflow: auto; padding: 22px 24px; box-shadow: 0 24px 70px rgba(0,0,0,.65); }
  .reagrow { display: grid; grid-template-columns: 1fr 80px auto; gap: 8px; margin-bottom: 6px; }
  #toasts { position: fixed; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 60; }
  .toast { background: #22232c; border: 1px solid var(--line2); border-left: 3px solid var(--accent); padding: 10px 14px; border-radius: 8px; max-width: 380px; box-shadow: 0 10px 28px rgba(0,0,0,.5); }
  .toast.good { border-left-color: var(--good); } .toast.bad { border-left-color: var(--bad); }
  ::-webkit-scrollbar { height: 10px; width: 10px; }
  ::-webkit-scrollbar-thumb { background: #34343c; border-radius: 6px; border: 2px solid #111217; }
  ::-webkit-scrollbar-track { background: transparent; }

  @media (max-width: 780px) {
    header.top { padding: 10px 14px; gap: 10px; position: static; }
    nav.tabs { justify-content: flex-start; padding: 0 8px; position: sticky; top: 0; z-index: 20; }
    main { padding: 16px 14px 60px; }
    .grid2 { grid-template-columns: 1fr; }
    #ahStatus { order: 5; width: 100%; max-width: none; border-radius: 10px; }
    .brand { width: 100%; }
    .brand .sub { display: none; }
    .budget { flex: 1; }
    .budget input { flex: 1; width: auto; }
    .card { padding: 14px; }
    .profs { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .prof { padding: 7px 8px; gap: 7px; }
    .prof .ico { display: none; }
    .prof input { flex-basis: 44px; width: 44px; padding: 5px 6px; }
    .profname { font-size: 11.5px; }
    .heroes { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true">⚒</div>
    <div><h1>Forever AH Crafting</h1><div class="sub">Crafting profit, budgets &amp; disenchanting for WoW Forever / Classic</div></div>
  </div>
  <div id="ahStatus"></div>
  <label class="budget">Budget <input id="budgetInput" placeholder="e.g. 250g" title="Gold you want to spend. Examples: 250g, 12g 50s, 75 (= 75 gold)"></label>
  <button id="syncBtn" class="btn primary" title="Download current auction house prices">↻ Update prices</button>
</header>
<nav class="tabs" id="tabs">
  <button data-tab="best">Best crafts</button>
  <button data-tab="planner">Budget planner</button>
  <button data-tab="de">Disenchanting</button>
  <button data-tab="prices">Prices</button>
  <button data-tab="recipes">Recipes</button>
  <button data-tab="settings">Settings &amp; sync</button>
</nav>
<main>
  <section id="tab-best" class="tab"></section>
  <section id="tab-planner" class="tab"></section>
  <section id="tab-de" class="tab"></section>
  <section id="tab-prices" class="tab"></section>
  <section id="tab-recipes" class="tab"></section>
  <section id="tab-settings" class="tab"></section>
</main>
<div id="modal" class="modal hidden"></div>
<div id="toasts"></div>
<datalist id="itemNames"></datalist>
<datalist id="recipeNames"></datalist>

<script src="data-items.js"></script>
<script src="data-recipes.js"></script>
<script src="data-forever.js"></script>
<script src="app-core.js"></script>
<script src="app-ui.js"></script>
</body>
</html>
