<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forever AH Crafting</title>
<style>
  :root {
    --bg: #0e1014; --panel: #161920; --panel2: #1c2029; --line: #2a303c; --line2: #353c4a;
    --text: #e8e4d8; --muted: #9a958a; --dim: #6f6b62; --accent: #f0b232; --accent2: #c98d12;
    --good: #57c46f; --bad: #e2625a; --warn: #e8b04a; --link: #7cb6ff;
    --q0: #9d9d9d; --q1: #f2f2f2; --q2: #1eff00; --q3: #3d9cff; --q4: #b66dff; --q5: #ff8000;
    --cg: #ffd100; --cs: #c9c9d2; --cc: #e8a35e;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button, input, select, textarea { font: inherit; color: inherit; }
  h1, h2, h3 { font-family: Georgia, "Palatino Linotype", serif; font-weight: 600; letter-spacing: .2px; }
  h2 { font-size: 18px; margin: 0 0 10px; color: var(--accent); }
  h3 { font-size: 15px; margin: 18px 0 8px; color: var(--text); }
  .muted { color: var(--muted); } .dim { color: var(--dim); }
  .good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); }
  .small { font-size: 12px; }
  .nowrap { white-space: nowrap; }
  .hidden { display: none !important; }

  /* header */
  header.top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 12px 20px;
    background: linear-gradient(180deg, #1b1f28, #13161c); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
  .logo { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; font-size: 18px;
    background: radial-gradient(circle at 30% 30%, #ffd86b, #b07a0c); color: #2a1c00; box-shadow: 0 0 0 1px #6b4a06 inset; }
  .brand h1 { margin: 0; font-size: 19px; color: var(--accent); }
  .brand .sub { font-size: 12px; color: var(--muted); }
  #ahStatus { font-size: 12px; color: var(--muted); max-width: 420px; }
  #ahStatus b { color: var(--text); font-weight: 600; }
  .budget { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .budget input { width: 130px; }

  nav.tabs { display: flex; gap: 2px; padding: 0 20px; background: #12151b; border-bottom: 1px solid var(--line); overflow-x: auto; }
  nav.tabs button { background: none; border: 0; padding: 11px 14px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
  nav.tabs button:hover { color: var(--text); }
  nav.tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
  main { padding: 18px 20px 60px; max-width: 1500px; margin: 0 auto; }

  /* controls */
  input[type=text], input[type=number], input[type=password], input:not([type]), select, textarea {
    background: #0f1217; border: 1px solid var(--line2); border-radius: 6px; padding: 6px 9px; outline: none; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent2); box-shadow: 0 0 0 2px rgba(240,178,50,.15); }
  textarea { width: 100%; min-height: 120px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .btn { background: var(--panel2); border: 1px solid var(--line2); border-radius: 6px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--accent2); }
  .btn.primary { background: linear-gradient(180deg, #f4c04f, #d4960f); color: #241800; border-color: #a77408; font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.07); }
  .btn.danger { color: var(--bad); }
  .btn.sm { padding: 3px 8px; font-size: 12px; }
  .btn:disabled { opacity: .5; cursor: default; }
  label.chk { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row + .row { margin-top: 10px; }
  .field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  .field > input, .field > select { color: var(--text); font-size: 14px; }
  .spacer { flex: 1; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px; }
  .card.tight { padding: 10px 14px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px; }
  .banner { border: 1px solid #5a4a1f; background: #231d10; color: #f3dfa8; border-radius: var(--radius); padding: 10px 14px; margin-bottom: 14px; }
  .banner.info { border-color: #24405f; background: #111c29; color: #c8dcf5; }

  .profs { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
  .prof { display: flex; align-items: center; gap: 8px; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  .prof span { flex: 1; min-width: 0; font-size: 13px; }
  .prof input { flex: 0 0 70px; width: 70px; text-align: right; }
  .prof.on { border-color: #5b4615; }
  .prof.on span { color: var(--accent); }

  /* tables */
  .tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 6px 9px; border-bottom: 1px solid #222733; text-align: left; vertical-align: middle; }
  th { background: #191d25; color: var(--muted); font-weight: 600; font-size: 12px; position: sticky; top: 0; z-index: 1; white-space: nowrap; }
  th.sort { cursor: pointer; }
  th.sort:hover { color: var(--text); }
  th.sorted { color: var(--accent); }
  td.num, th.num { text-align: right; white-space: nowrap; }
  tbody tr:hover { background: #1a1e27; }
  tr.clickable { cursor: pointer; }
  tr.locked td { opacity: .5; }
  tr.detail > td { background: #12151b; padding: 10px 14px 14px; }
  tr.grouphead td { background: #1d2230; color: var(--accent); font-weight: 600; font-family: Georgia, serif; }
  td input { padding: 3px 6px; font-size: 12px; }
  td input.id { width: 76px; } td input.price { width: 92px; }

  .item { font-weight: 500; }
  .q0 { color: var(--q0); } .q1 { color: var(--q1); } .q2 { color: var(--q2); } .q3 { color: var(--q3); } .q4 { color: var(--q4); } .q5 { color: var(--q5); }
  .money { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .money i { font-style: normal; font-size: 11px; margin-left: 1px; }
  .money.neg { color: var(--bad); }
  i.cg { color: var(--cg); } i.cs { color: var(--cs); } i.cc { color: var(--cc); }
  .pos .money { color: var(--good); }

  .badge { display: inline-block; font-size: 10.5px; line-height: 1; padding: 3px 5px; border-radius: 4px; margin-left: 5px; vertical-align: 1px;
    border: 1px solid var(--line2); color: var(--muted); white-space: nowrap; }
  .badge.pat { border-color: #47395f; color: #c9a8ff; }
  .badge.cd { border-color: #2f4f6b; color: #8cc4ff; }
  .badge.u { border-color: #5f4b20; color: #e8c46a; }
  .badge.custom { border-color: #2d5a3a; color: #7fdc95; }
  .badge.de { border-color: #3e2f63; color: #b98cff; }
  .badge.note { border-color: #3a3f4c; color: #b5b0a4; cursor: help; }
  .src { font-size: 11px; color: var(--muted); }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .stat { background: var(--panel2); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
  .stat .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .stat .v { font-size: 18px; margin-top: 3px; }
  .log { font-family: ui-monospace, Consolas, monospace; font-size: 12px; background: #0b0d11; border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 10px; max-height: 220px; overflow: auto; white-space: pre-wrap; color: #b9b4a8; }
  .steps { margin: 0; padding-left: 20px; color: var(--muted); }
  .steps li { margin: 3px 0; }
  code { background: #0b0d11; border: 1px solid var(--line); padding: 1px 5px; border-radius: 4px; font-size: 12px; }

  /* modal & toast */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: grid; place-items: center; z-index: 50; padding: 16px; }
  .modal .box { background: var(--panel); border: 1px solid var(--line2); border-radius: 10px; width: min(720px, 100%); max-height: 90vh; overflow: auto; padding: 18px 20px; }
  .reagrow { display: grid; grid-template-columns: 1fr 80px auto; gap: 8px; margin-bottom: 6px; }
  #toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 60; }
  .toast { background: #20252f; border: 1px solid var(--line2); border-left: 3px solid var(--accent); padding: 9px 12px; border-radius: 6px; max-width: 380px; box-shadow: 0 6px 20px rgba(0,0,0,.4); }
  .toast.good { border-left-color: var(--good); } .toast.bad { border-left-color: var(--bad); }

  @media (max-width: 700px) {
    header.top, nav.tabs, main { padding-left: 12px; padding-right: 12px; }
    .grid2 { grid-template-columns: 1fr; }
    #ahStatus { order: 5; width: 100%; max-width: none; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true">⚒</div>
    <div><h1>Forever AH Crafting</h1><div class="sub">Crafting profit, budgets &amp; disenchanting for WoW Forever / Classic</div></div>
  </div>
  <div id="ahStatus"></div>
  <label class="budget">Budget <input id="budgetInput" placeholder="e.g. 250g" title="Gold you want to spend. Examples: 250g, 12g 50s, 75 (= 75 gold)"></label>
  <button id="syncBtn" class="btn primary" title="Download current auction house prices">↻ Update prices</button>
</header>
<nav class="tabs" id="tabs">
  <button data-tab="best">Best crafts</button>
  <button data-tab="planner">Budget planner</button>
  <button data-tab="de">Disenchanting</button>
  <button data-tab="prices">Prices</button>
  <button data-tab="recipes">Recipes</button>
  <button data-tab="settings">Settings &amp; sync</button>
</nav>
<main>
  <section id="tab-best" class="tab"></section>
  <section id="tab-planner" class="tab"></section>
  <section id="tab-de" class="tab"></section>
  <section id="tab-prices" class="tab"></section>
  <section id="tab-recipes" class="tab"></section>
  <section id="tab-settings" class="tab"></section>
</main>
<div id="modal" class="modal hidden"></div>
<div id="toasts"></div>
<datalist id="itemNames"></datalist>
<datalist id="recipeNames"></datalist>

<script src="data-items.js"></script>
<script src="data-recipes.js"></script>
<script src="data-forever.js"></script>
<script src="app-core.js"></script>
<script src="app-ui.js"></script>
</body>
</html>
