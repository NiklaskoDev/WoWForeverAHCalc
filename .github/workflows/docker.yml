name: Build container image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/niklaskodev/wowforeverahcalc

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t "$IMAGE:test" .

      - name: Smoke test with Unraid-style permissions
        run: |
          mkdir appdata
          sudo chown root:root appdata
          docker run -d --name smoke -p 8080:8080 -v "$PWD/appdata:/data" "$IMAGE:test"
          for i in $(seq 1 20); do curl -fs http://localhost:8080/api/status && break; sleep 1; done
          curl -fs http://localhost:8080/api/status | grep -q '"enabled": false'
          curl -fs http://localhost:8080/ | grep -q 'Forever AH Crafting'
          curl -fs -o /dev/null http://localhost:8080/data-forever.js
          curl -fs http://localhost:8080/api/addon/prices.lua | grep -q '^ForeverAHPrices_Data'
          curl -fs -o addon.zip http://localhost:8080/api/addon/ForeverAHPrices.zip
          python3 -m zipfile -l addon.zip | grep -q 'ForeverAHPrices/ForeverAHPrices.toc'
          python3 -m zipfile -l addon.zip | grep -q 'ForeverAHPrices/Sync prices.bat'
          docker exec -u 99:100 smoke touch /data/write-test
          docker top smoke -eo pid,uid,cmd | awk '/server.py/ && $2 == 99 {found=1} END {exit !found}'
          docker rm -f smoke

      - name: Publish
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "$IMAGE:test" "$IMAGE:latest"
          docker push "$IMAGE:latest"
